<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 26px; fill: #f8fafc; text-anchor: middle; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 14px; fill: #94a3b8; text-anchor: middle; }
      .box-client { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 10px; }
      .box-api { fill: #0f172a; stroke: #0284c7; stroke-width: 2.5; rx: 12px; }
      .box-tcp-zone { fill: #062e24; fill-opacity: 0.35; stroke: #10b981; stroke-width: 2; stroke-dasharray: 6 4; rx: 16px; }
      .box-udp-zone { fill: #1e1b4b; fill-opacity: 0.35; stroke: #818cf8; stroke-width: 2; stroke-dasharray: 6 4; rx: 16px; }
      .box-node { fill: #1e293b; stroke: #475569; stroke-width: 1.5; rx: 8px; }
      .box-db { fill: #2e1065; stroke: #a855f7; stroke-width: 2; rx: 10px; }
      .box-method1 { fill: #1e293b; stroke: #f59e0b; stroke-width: 2; rx: 8px; }
      .box-method2 { fill: #1e293b; stroke: #ef4444; stroke-width: 2; rx: 8px; }
      .box-method3 { fill: #1e293b; stroke: #10b981; stroke-width: 2; rx: 8px; }
      .txt-header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
      .txt-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .txt-badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 800; letter-spacing: 0.5px; }
      .txt-edge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #94a3b8; }
      .edge { stroke: #64748b; stroke-width: 1.8; fill: none; }
      .edge-blue { stroke: #38bdf8; stroke-width: 2; fill: none; }
      .edge-green { stroke: #10b981; stroke-width: 2; fill: none; }
      .edge-red { stroke: #ef4444; stroke-width: 2; fill: none; }
      .edge-purple { stroke: #818cf8; stroke-width: 2; fill: none; }
      .edge-orange-dash { stroke: #f59e0b; stroke-width: 2; stroke-dasharray: 5 4; fill: none; }
    </style>

    <!-- Marker Arrowheads -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1280" class="bg" />

  <!-- Title & Subtitle -->
  <text x="600" y="45" class="title">WMS DUAL-TRACK ARCHITECTURE &amp; SELF-HEALING TELEMETRY</text>
  <text x="600" y="75" class="subtitle">Diagram 2 Jalur: Transaksi Bisnis (TCP/ACID) vs Telemetri Status Log (UDP + Tri-Method Zero-Loss)</text>

  <!-- 1. Client / Scanner -->
  <g transform="translate(450, 105)">
    <rect width="300" height="60" class="box-client" />
    <text x="150" y="27" text-anchor="middle" class="txt-header">📱 Client / Frontend / Scanner</text>
    <text x="150" y="47" text-anchor="middle" class="txt-sub">Barcoders, Web UI, ERP Integration</text>
  </g>

  <!-- Flow 1: Client to API -->
  <path d="M 600 165 L 600 205" class="edge-blue" marker-end="url(#arrow-blue)" />
  <rect x="460" y="175" width="280" height="20" rx="4" fill="#0f172a" fill-opacity="0.9" />
  <text x="600" y="189" text-anchor="middle" class="txt-edge">1. HTTP Request (Inbound, Outbound, Stock)</text>

  <!-- 2. WMS Core API -->
  <g transform="translate(400, 210)">
    <rect width="400" height="75" class="box-api" />
    <text x="200" y="32" text-anchor="middle" class="txt-header">⚡ WMS Core API (Express.js :5000)</text>
    <text x="200" y="55" text-anchor="middle" class="txt-sub">Routing, Auth JWT, Telemetry Middleware, Business Logic</text>
  </g>

  <!-- SPLIT INTO TWO MAJOR TRACKS -->

  <!-- ========================================================================= -->
  <!-- LEFT ZONE: JALUR UTAMA (DATA TRANSAKSI BISNIS - TCP)                      -->
  <!-- ========================================================================= -->
  <rect x="50" y="325" width="480" height="490" class="box-tcp-zone" />
  <rect x="65" y="338" width="450" height="30" rx="6" fill="#064e3b" />
  <text x="290" y="358" text-anchor="middle" class="txt-badge" fill="#34d399">JALUR UTAMA: DATA TRANSAKSI BISNIS (TCP)</text>

  <!-- API to Jalur Utama -->
  <path d="M 450 285 L 290 400" class="edge-green" marker-end="url(#arrow-green)" />
  <rect x="230" y="320" width="160" height="20" rx="4" fill="#0f172a" />
  <text x="310" y="334" text-anchor="middle" class="txt-edge" fill="#34d399">2. Eksekusi Data Bisnis</text>

  <!-- Node: Prisma ORM -->
  <g transform="translate(90, 400)">
    <rect width="400" height="65" class="box-node" stroke="#10b981" />
    <text x="200" y="27" text-anchor="middle" class="txt-header">Prisma ORM Client &amp; Query Engine</text>
    <text x="200" y="47" text-anchor="middle" class="txt-sub">Validasi Schema, Connection Pool, Prepared Statement</text>
  </g>

  <!-- Prisma to DB -->
  <path d="M 290 465 L 290 515" class="edge-green" marker-end="url(#arrow-green)" />
  <text x="300" y="495" class="txt-edge">3. TCP Handshake &amp; Commit</text>

  <!-- Node: PostgreSQL Database (Transactional) -->
  <g transform="translate(90, 520)">
    <rect width="400" height="95" class="box-db" stroke="#10b981" />
    <text x="200" y="30" text-anchor="middle" class="txt-header">🗄️ PostgreSQL Database (:5432)</text>
    <text x="200" y="52" text-anchor="middle" class="txt-sub">Tabel: products, inventory, transactions, orders</text>
    <text x="200" y="74" text-anchor="middle" class="txt-sub" fill="#34d399">✓ Full ACID Transaction Guarantee (Anti Data Mismatch)</text>
  </g>

  <!-- DB to Response 200 OK -->
  <path d="M 290 615 L 290 665" class="edge-green" marker-end="url(#arrow-green)" />
  <g transform="translate(90, 670)">
    <rect width="400" height="60" class="box-node" stroke="#059669" />
    <text x="200" y="26" text-anchor="middle" class="txt-header">4. Response Langsung ke Client (200 OK)</text>
    <text x="200" y="46" text-anchor="middle" class="txt-sub">Latensi Rendah: Client tidak tertahan proses logging</text>
  </g>

  <g transform="translate(90, 750)">
    <rect width="400" height="45" rx="6" fill="#042f2e" stroke="#14b8a6" stroke-width="1" />
    <text x="200" y="28" text-anchor="middle" class="txt-sub" fill="#2dd4bf">⏱️ Rata-rata Latensi Transaksi Bisnis: 5 - 15 ms</text>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT ZONE: JALUR TELEMETRI (LOG & MONITORING - UDP + TRI-METHOD)         -->
  <!-- ========================================================================= -->
  <rect x="560" y="325" width="590" height="850" class="box-udp-zone" />
  <rect x="575" y="338" width="560" height="30" rx="6" fill="#312e81" />
  <text x="855" y="358" text-anchor="middle" class="txt-badge" fill="#a5b4fc">JALUR TELEMETRI: STATUS LOG &amp; METRICS (UDP + TRI-METHOD)</text>

  <!-- API to Jalur Telemetri -->
  <path d="M 750 285 L 850 400" class="edge-purple" marker-end="url(#arrow-purple)" />
  <rect x="760" y="320" width="180" height="20" rx="4" fill="#0f172a" />
  <text x="850" y="334" text-anchor="middle" class="txt-edge" fill="#a5b4fc">5. Non-blocking Asinkron</text>

  <!-- Node: sendUdpTelemetry() Engine -->
  <g transform="translate(600, 400)">
    <rect width="510" height="65" class="box-node" stroke="#818cf8" />
    <text x="255" y="27" text-anchor="middle" class="txt-header">Telemetry Engine: sendUdpTelemetry()</text>
    <text x="255" y="47" text-anchor="middle" class="txt-sub">Generate seqId Monoton + Masking Data Sensitif (Password, Token)</text>
  </g>

  <!-- Telemetry Engine to Ring Buffer -->
  <path d="M 855 465 L 855 495" class="edge-purple" marker-end="url(#arrow-purple)" />

  <!-- Node: Ring Buffer (Sliding Window) -->
  <g transform="translate(600, 500)">
    <rect width="510" height="65" class="box-method1" />
    <text x="255" y="27" text-anchor="middle" class="txt-header" fill="#f59e0b">Sliding Window Ring Buffer (RAM API)</text>
    <text x="255" y="47" text-anchor="middle" class="txt-sub">Menyimpan 3.000 log terakhir untuk kebutuhan NACK Selective Retransmission</text>
  </g>

  <!-- Branching: Severity Check -->
  <path d="M 855 565 L 855 595" class="edge" marker-end="url(#arrow)" />
  <g transform="translate(730, 595)">
    <polygon points="125,0 250,30 125,60 0,30" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="125" y="35" text-anchor="middle" class="txt-header" font-size="12px">Cek Tingkat Severity?</text>
  </g>

  <!-- Branch Left: METODE 2 (TCP Fallback) -->
  <path d="M 730 625 L 680 625 L 680 685" class="edge-red" marker-end="url(#arrow-red)" />
  <rect x="615" y="640" width="130" height="18" rx="4" fill="#450a0a" />
  <text x="680" y="653" text-anchor="middle" class="txt-edge" fill="#f87171">Status 500 / ERROR</text>

  <g transform="translate(580, 690)">
    <rect width="220" height="70" class="box-method2" />
    <text x="110" y="25" text-anchor="middle" class="txt-header" fill="#ef4444" font-size="13px">METODE 2: TCP Fallback</text>
    <text x="110" y="44" text-anchor="middle" class="txt-sub" font-size="11px">POST /telemetry-tcp-ingest</text>
    <text x="110" y="60" text-anchor="middle" class="txt-sub" font-size="10px" fill="#fca5a5">Bypass UDP (Anti Loss 100%)</text>
  </g>

  <!-- Branch Right: METODE 3 (Piggyback + UDP) -->
  <path d="M 980 625 L 1030 625 L 1030 685" class="edge-green" marker-end="url(#arrow-green)" />
  <rect x="965" y="640" width="130" height="18" rx="4" fill="#064e3b" />
  <text x="1030" y="653" text-anchor="middle" class="txt-edge" fill="#34d399">Normal (200 / INFO)</text>

  <g transform="translate(900, 690)">
    <rect width="230" height="70" class="box-method3" />
    <text x="115" y="25" text-anchor="middle" class="txt-header" fill="#10b981" font-size="13px">METODE 3: Piggybacking</text>
    <text x="115" y="44" text-anchor="middle" class="txt-sub" font-size="11px">Sisipkan ringkasan 2 paket lalu</text>
    <text x="115" y="60" text-anchor="middle" class="txt-sub" font-size="10px" fill="#86efac">Zero-RTT FEC Recovery (0ms)</text>
  </g>

  <!-- UDP Send -->
  <path d="M 1015 760 L 1015 790 L 890 790 L 890 820" class="edge-purple" marker-end="url(#arrow-purple)" />
  <text x="960" y="805" class="txt-edge">Kirim UDP Datagram (:5001)</text>

  <!-- TCP Fallback to Aggregator -->
  <path d="M 690 760 L 690 790 L 820 790 L 820 820" class="edge-red" marker-end="url(#arrow-red)" />

  <!-- Node: UDP Log Aggregator Server -->
  <g transform="translate(600, 825)">
    <rect width="510" height="95" class="box-node" stroke="#a855f7" stroke-width="2" />
    <text x="255" y="28" text-anchor="middle" class="txt-header">📥 UDP Log Aggregator Server (Port :5001)</text>
    <text x="255" y="50" text-anchor="middle" class="txt-sub">Deteksi Sequence Continuity: seqId != expectedSeqId</text>
    <text x="255" y="70" text-anchor="middle" class="txt-sub" fill="#c084fc">1. Drop 1-2 paket: Pulihkan seketika dari Piggyback (0ms)</text>
    <text x="255" y="87" text-anchor="middle" class="txt-sub" fill="#f59e0b">2. Drop &gt; 2 paket: Trigger METODE 1 (NACK Retransmission via TCP)</text>
  </g>

  <!-- NACK Retransmission Loop (Metode 1 Back to Ring Buffer) -->
  <path d="M 600 870 C 530 870, 520 530, 595 530" class="edge-orange-dash" marker-end="url(#arrow-orange)" />
  <rect x="495" y="685" width="130" height="35" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="1" />
  <text x="560" y="700" text-anchor="middle" class="txt-edge" fill="#fbbf24">METODE 1 (NACK)</text>
  <text x="560" y="713" text-anchor="middle" class="txt-edge" font-size="9px" fill="#fde68a">POST /telemetry-resend</text>

  <!-- Aggregator to In-Memory Batch Buffer -->
  <path d="M 855 920 L 855 955" class="edge-purple" marker-end="url(#arrow-purple)" />
  <g transform="translate(600, 960)">
    <rect width="510" height="60" class="box-node" stroke="#6366f1" />
    <text x="255" y="26" text-anchor="middle" class="txt-header">RAM Batch Buffer (Aggregator)</text>
    <text x="255" y="46" text-anchor="middle" class="txt-sub">Menampung log valid + log yang berhasil dipulihkan (OOM Protection &lt; 50k)</text>
  </g>

  <!-- Batch Flush to Database -->
  <path d="M 855 1020 L 855 1055" class="edge-purple" marker-end="url(#arrow-purple)" />
  <text x="865" y="1042" class="txt-edge">Hybrid Flush (100 logs / 2000 ms)</text>

  <!-- Node: PostgreSQL Database (Telemetry Logs) -->
  <g transform="translate(600, 1060)">
    <rect width="510" height="90" class="box-db" stroke="#a855f7" />
    <text x="255" y="28" text-anchor="middle" class="txt-header">🗄️ PostgreSQL Database (Tabel telemetry_logs)</text>
    <text x="255" y="50" text-anchor="middle" class="txt-sub">Bulk Insert SQL: Ringan CPU, throughput tinggi &gt; 5.000 log/detik</text>
    <text x="255" y="72" text-anchor="middle" class="txt-sub" fill="#34d399">✓ Effective Packet Loss: 0.00% (Semua paket pulih otomatis)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- FOOTER SUMMARY                                                            -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 1195)">
    <rect width="1100" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="550" y="26" text-anchor="middle" class="txt-header" fill="#38bdf8" font-size="14px">RINGKASAN KEUNGGULAN DUAL-TRACK ARCHITECTURE</text>
    <text x="550" y="48" text-anchor="middle" class="txt-sub" font-size="12px">
      1. Jalur Utama (TCP): Menjamin 100% konsistensi stok &amp; pesanan tanpa delay logging | 2. Jalur Telemetri (UDP): Ekstra cepat (~0.3ms) dipadukan dengan 3 Lapis Pemulihan Otomatis (Zero-Loss).
    </text>
  </g>
</svg>

